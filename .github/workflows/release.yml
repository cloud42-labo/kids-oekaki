name: Release Kids Oekaki

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify tag matches package version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build PWA
        run: npm run build
      - name: E2E tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Sync Capacitor Android project
        run: npm run android:sync
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Package release assets
        shell: bash
        run: |
          cd dist
          zip -r "../kids-oekaki-${GITHUB_REF_NAME}.zip" .
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk "kids-oekaki-${GITHUB_REF_NAME}-debug.apk"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "kids-oekaki-$GITHUB_REF_NAME.zip" \
            "kids-oekaki-$GITHUB_REF_NAME-debug.apk" \
            --verify-tag \
            --generate-notes \
            --title "Kids Oekaki $GITHUB_REF_NAME"
