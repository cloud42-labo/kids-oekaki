name: Release Kids Oekaki

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
            if [ "${TAG#v}" != "$PACKAGE_VERSION" ]; then
              echo "Tag $TAG does not match package.json version $PACKAGE_VERSION"
              exit 1
            fi
          else
            TAG="v$PACKAGE_VERSION"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build PWA
        run: npm run build
      - name: E2E tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Sync Capacitor Android project
        run: npm run android:sync
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Package release assets
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          cd dist
          zip -r "../kids-oekaki-${TAG}.zip" .
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk "kids-oekaki-${TAG}-debug.apk"
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "kids-oekaki-${TAG}.zip" \
              "kids-oekaki-${TAG}-debug.apk" \
              --clobber
          else
            gh release create "$TAG" \
              "kids-oekaki-${TAG}.zip" \
              "kids-oekaki-${TAG}-debug.apk" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "Kids Oekaki $TAG"
          fi
