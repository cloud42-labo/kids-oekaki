name: Oekaki CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e

  android-debug-build:
    needs: build-and-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build PWA
        run: npm run build
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        # v3's default `packages` input requests the legacy `tools` package, which Google
        # stopped serving from the SDK repository (2026-09-15). v4 defaults to `platform-tools`
        # only; AGP resolves the compileSdk/build-tools it needs on its own.
        uses: android-actions/setup-android@v4
      - name: Sync Capacitor Android project
        run: npm run android:sync
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
        env:
          # debug build only (docs/ANDROID_DISTRIBUTION.md); unsigned APKs are not installable,
          # so this uses Capacitor/Android Studio's auto-generated debug keystore.
          ANDROID_VERSION_CODE: ${{ github.run_number }}
      - name: Label APK with version/run for Human Acceptance traceability
        id: apk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          LABEL="kids-oekaki-v${VERSION}-debug-build${{ github.run_number }}"
          mkdir -p android/app/build/outputs/apk/debug/labeled
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "android/app/build/outputs/apk/debug/labeled/${LABEL}.apk"
          echo "label=${LABEL}" >> "$GITHUB_OUTPUT"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.label }}
          path: android/app/build/outputs/apk/debug/labeled/${{ steps.apk.outputs.label }}.apk
          if-no-files-found: error
