name: Oekaki CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm run test:unit
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e

  android-debug-build:
    needs: build-and-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build PWA
        run: npm run build
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        # v3's default `packages` input requests the legacy `tools` package, which Google
        # stopped serving from the SDK repository (2026-09-15). v4 defaults to `platform-tools`
        # only; AGP resolves the compileSdk/build-tools it needs on its own.
        uses: android-actions/setup-android@v4
      - name: Sync Capacitor Android project
        run: npm run android:sync
      - name: Assemble non-distributable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
        env:
          # CI only. This debug APK uses an ephemeral runner key and MUST NOT be
          # installed as a distributed build. User-installable APK/AAB artifacts
          # are produced only by release.yml with the persistent Oekaki signing key.
          ANDROID_VERSION_CODE: ${{ github.run_number }}
      - name: Record Android build-check result
        run: |
          echo "### Android build check" >> "$GITHUB_STEP_SUMMARY"
          echo "assembleDebug succeeded. No debug APK is published because its ephemeral signature cannot support in-place updates." >> "$GITHUB_STEP_SUMMARY"
